<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bahrain Driving Licence Guide</title>
<meta name="description" content="Step-by-step guide to getting your Bahrain driving licence — costs, documents and driving lessons in 6 languages.">
<meta property="og:title" content="Bahrain Driving Licence Guide">
<meta property="og:description" content="English · العربية · اردو · हिन्दी · മലയാളം · فارسی">
<meta name="theme-color" content="#ce1126">
<style>
:root{--red:#ce1126;--ink:#1b1f24;--muted:#5d6670;--bg:#f5f6f8;--card:#fff;--line:#e3e6ea;--ok:#1a8f4a;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--ink:#eef1f4;--muted:#a3acb6;--bg:#121417;--card:#1d2126;--line:#2e343b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Arabic","Noto Nastaliq Urdu","Noto Sans Malayalam","Noto Sans Devanagari",sans-serif}
header{background:var(--red);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;text-align:start;cursor:pointer;margin-bottom:10px}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red);text-align:center}
.btn.wa{background:#25d366;color:#fff;border-color:#25d366;text-align:center}
.lang{font-size:20px;text-align:center}
.row{display:flex;gap:10px}.row .btn{flex:1;text-align:center}
.num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;align-items:center;justify-content:center;font-size:14px;margin-inline-end:8px;flex:none}
h2{font-size:20px;margin:4px 0 12px}h3{margin:0 0 6px;font-size:17px;display:flex;align-items:center}
p{margin:0}.muted{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse}td{padding:10px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:end;font-weight:600;white-space:nowrap}
tr.total td{border:0;font-size:19px;color:var(--red)}
ul{margin:0;padding-inline-start:20px}li{margin:6px 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--ok)}
.tick{color:var(--ok);margin-inline-start:auto}
img,video{width:100%;border-radius:10px;margin-top:10px;background:#000}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--red)}
</style>
</head>
<body>
<header><h1 id="title">🚗 Bahrain Driving Licence</h1><button id="langBtn" hidden>🌐</button></header>
<main id="app"></main>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
const $app = document.getElementById('app');
const C = window.CONFIG, F = C.fees;
let L, T;
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MEDIA = { 2: ['img:assets/roundabout-route.jpg', 'vid:assets/roundabout.mp4'], 6: ['vid:assets/practice1.mp4', 'vid:assets/practice2.mp4', 'vid:assets/clip.mp4'], 7: ['img:assets/school-map.jpg'] };

function setLang(code) {
  L = code; T = I18N[code]; store.set('lang', code);
  document.documentElement.lang = code; document.documentElement.dir = T.dir;
  document.getElementById('langBtn').hidden = false;
  home();
}
function go(html) { $app.innerHTML = html; scrollTo(0, 0); }
const backBtn = () => `<button class="btn" onclick="home()">🏠 ${T.ui.home}</button>`;
const waBtn = () => C.whatsapp ? `<a class="btn wa" style="text-decoration:none" href="https://wa.me/${C.whatsapp}" target="_blank" rel="noopener">💬 ${T.ui.whatsapp}</a>` : '';

function langScreen() {
  document.getElementById('langBtn').hidden = true;
  go(`<div class="card" style="text-align:center"><div style="font-size:44px">🚗🇧🇭</div>
    <h2>Choose your language</h2><p class="muted">اختر لغتك · اپنی زبان منتخب کریں · अपनी भाषा चुनें · ഭാഷ തിരഞ്ഞെടുക്കുക · زبان خود را انتخاب کنید</p></div>
    ${Object.keys(I18N).map(k => `<button class="btn lang" onclick="setLang('${k}')">${I18N[k].name}</button>`).join('')}`);
}

function home() {
  const done = store.get('done', []);
  const pct = Math.round(done.length / T.lessons.length * 100);
  const m = T.menu;
  go(`<div class="card"><h2>${esc(T.welcome.title)}</h2><p>${esc(T.welcome.text)}</p></div>
    <button class="btn" onclick="steps(0)">📋 ${m.steps}</button>
    <button class="btn" onclick="costs()">💰 ${m.costs}</button>
    <button class="btn" onclick="docs()">🪪 ${m.docs}</button>
    <button class="btn" onclick="guide()">📘 ${m.guide}<div class="bar"><i style="width:${pct}%"></i></div><span class="muted">${T.ui.progress}: ${done.length}/${T.lessons.length}</span></button>
    <button class="btn" onclick="quiz(0,0)">❓ ${m.quiz}</button>
    <button class="btn" onclick="mapView()">🗺️ ${m.map}</button>
    ${waBtn()}<p class="muted" style="margin-top:8px">${esc(T.ui.disclaimer)}</p>`);
}

function steps(i) {
  const s = T.steps[i], n = T.steps.length;
  go(`<div class="dots">${T.steps.map((_, j) => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="card"><h3><span class="num">${i + 1}</span>${esc(s.t)}</h3><p>${esc(s.d)}</p></div>
    <div class="row">${i > 0 ? `<button class="btn" onclick="steps(${i - 1})">${T.ui.back}</button>` : ''}
    ${i < n - 1 ? `<button class="btn primary" onclick="steps(${i + 1})">${T.ui.next}</button>` : `<button class="btn primary" onclick="home()">${T.ui.done} ✓</button>`}</div>`);
}

function costs() {
  const c = T.costs, u = T.ui, cls = F.hours * F.perHour;
  const total = F.eyeTest + F.learningBook + F.examAppointment + cls + F.licenseCard;
  const r = (a, b) => `<tr><td>${a}</td><td>${b} ${u.bd}</td></tr>`;
  go(`<h2>💰 ${T.menu.costs}</h2><div class="card"><table>
    ${r(c.eye, F.eyeTest)}${r(c.book, F.learningBook)}${r(c.exam, F.examAppointment)}
    ${r(`${c.classes}<div class="muted">${F.hours} ${u.hours} × ${F.perHour} ${u.bd} ${u.perHour}</div>`, cls)}
    ${r(c.card, F.licenseCard)}<tr class="total"><td>${u.total}</td><td>${total} ${u.bd}</td></tr></table></div>
    <div class="card"><p>💳 ${esc(u.payNote)}</p></div>${waBtn()}${backBtn()}`);
}

function docs() {
  go(`<h2>🪪 ${T.menu.docs}</h2><div class="card"><ul>${T.docs.map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>${backBtn()}`);
}

function guide() {
  const done = store.get('done', []);
  go(`<h2>📘 ${T.menu.guide}</h2>${T.lessons.map((l, i) => `<button class="btn" style="display:flex;align-items:center" onclick="lesson(${i})"><span class="num">${i + 1}</span>${esc(l.t)}${done.includes(i) ? '<span class="tick">✓</span>' : ''}</button>`).join('')}${backBtn()}`);
}

function lesson(i) {
  const l = T.lessons[i], n = T.lessons.length;
  const media = (MEDIA[i] || []).map(m => m.startsWith('img:') ? `<img src="${m.slice(4)}" alt="" loading="lazy">` : `<video src="${m.slice(4)}" controls playsinline preload="metadata"></video>`).join('');
  go(`<div class="card"><h3><span class="num">${i + 1}</span>${esc(l.t)}</h3><ul>${l.p.map(p => `<li>${esc(p)}</li>`).join('')}</ul>${media}</div>
    <div class="row"><button class="btn" onclick="guide()">${T.ui.back}</button>
    <button class="btn primary" onclick="finish(${i})">${i < n - 1 ? T.ui.next : T.ui.done} ✓</button></div>`);
}
function finish(i) {
  const d = store.get('done', []); if (!d.includes(i)) d.push(i); store.set('done', d);
  i < T.lessons.length - 1 ? lesson(i + 1) : guide();
}

function quiz(i, score) {
  if (i >= T.quiz.length) {
    return go(`<div class="card" style="text-align:center"><h2>${T.ui.score}</h2><div style="font-size:44px;font-weight:700;color:var(--red)">${score} / ${T.quiz.length}</div></div>
      <button class="btn primary" onclick="quiz(0,0)">${T.ui.retry}</button>${backBtn()}`);
  }
  const q = T.quiz[i];
  go(`<p class="muted">${i + 1} / ${T.quiz.length}</p><div class="card"><h3>${esc(q.q)}</h3></div>
    ${q.o.map((o, j) => `<button class="btn opt" data-j="${j}" onclick="answer(${i},${score},${j})">${esc(o)}</button>`).join('')}<div id="fb"></div>`);
}
function answer(i, score, j) {
  const q = T.quiz[i], ok = j === q.a;
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; const k = +b.dataset.j; if (k === q.a) b.classList.add('ok'); else if (k === j) b.classList.add('bad'); });
  document.getElementById('fb').innerHTML = `<div class="card"><p>${ok ? '✅ ' + T.ui.correct : '❌ ' + T.ui.wrong + ' ' + esc(q.o[q.a])}</p></div>
    <button class="btn primary" onclick="quiz(${i + 1},${score + (ok ? 1 : 0)})">${T.ui.next}</button>`;
}

function mapView() {
  go(`<h2>🗺️ ${T.menu.map}</h2><div class="card"><img src="assets/school-map.jpg" alt=""></div>${backBtn()}`);
}

document.getElementById('langBtn').onclick = langScreen;
const saved = store.get('lang', null);
saved && I18N[saved] ? setLang(saved) : langScreen();
</script>
</body>
</html>
